<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2547b8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Meu Treino">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>*{box-sizing:border-box}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Meu Treino</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: ficha de academia virando app — abas por treino com a cor da caneta, lista de exercícios com séries tocáveis, cronômetro de descanso fixo embaixo */
:root{
  --bg:#eef0f2; --card:#ffffff; --fg:#1b2129; --muted:#5f6b78; --line:#d5dae0;
  --t1:#2547b8; --t2:#c22a2a; --t3:#22262c; --ok:#1f8a4c; --okbg:#e3f3e9;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --tc:var(--t1);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#13171c; --card:#1c2128; --fg:#e8ecf0; --muted:#97a2ae; --line:#2e353e;
  --t1:#6f8cf0; --t2:#ef6a62; --t3:#c9ced6; --ok:#4cc583; --okbg:#173325; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#13171c; --card:#1c2128; --fg:#e8ecf0; --muted:#97a2ae; --line:#2e353e;
  --t1:#6f8cf0; --t2:#ef6a62; --t3:#c9ced6; --ok:#4cc583; --okbg:#173325; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.4}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 120px;display:flex;flex-direction:column;gap:14px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:800;font-size:32px;line-height:1;margin:0;letter-spacing:.01em;text-transform:uppercase}
h1 small{display:block;font-family:var(--body);font-weight:500;font-size:13px;letter-spacing:.06em;color:var(--muted);text-transform:uppercase;margin-top:4px}
.nav{display:flex;gap:6px}
.nav button,.btn{font:600 14px var(--body);border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:8px;padding:8px 12px;cursor:pointer}
.nav button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--tc);outline-offset:2px}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding-block:6px;z-index:5}
.tab{border:2px solid var(--line);background:var(--card);border-radius:10px;padding:8px 6px;cursor:pointer;text-align:left;color:var(--fg)}
.tab b{display:block;font:800 22px/1 var(--display);text-transform:uppercase}
.tab span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.tab[aria-selected="true"]{border-color:var(--c);box-shadow:inset 0 -4px 0 var(--c)}
.tab[aria-selected="true"] b{color:var(--c)}
.phase{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.phase-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.phase .lab{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.phase .big{font:700 24px/1.05 var(--display);color:var(--tc)}
.phase select{font:500 14px var(--body);padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
.weeks{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.weeks i{height:6px;border-radius:3px;background:var(--line)}
.weeks i.on{background:var(--tc)}
.list{display:flex;flex-direction:column;gap:10px}
.ex{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;grid-template-columns:32px 1fr;gap:4px 12px;align-items:start}
.ex.done{background:var(--okbg);border-color:var(--ok)}
.num{font:800 24px/1 var(--display);color:var(--tc);text-align:center;padding-top:2px}
.ex.done .num{color:var(--ok)}
.ex-main{min-width:0;display:flex;flex-direction:column;gap:8px}
.ex-name{font-weight:600;font-size:17px;line-height:1.2}
.ex-meta{font-size:13px;color:var(--muted)}
.biset{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--tc);border:1px solid currentColor;border-radius:4px;padding:1px 6px;margin-left:6px;vertical-align:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.set{min-width:52px;height:44px;border-radius:8px;border:2px solid var(--line);background:var(--bg);color:var(--fg);font:700 18px var(--display);cursor:pointer;font-variant-numeric:tabular-nums}
.set.on{background:var(--ok);border-color:var(--ok);color:#fff}
.load{display:flex;align-items:center;gap:6px;margin-left:auto}
.load input{width:72px;height:44px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font:700 18px var(--display);text-align:center;font-variant-numeric:tabular-nums}
.load span{font-size:13px;color:var(--muted)}
.prev{font-size:12px;color:var(--muted)}
.vid{margin-left:auto;font:600 14px var(--body);color:var(--tc);text-decoration:none;border:1px solid var(--line);border-radius:8px;padding:8px 12px;background:var(--bg);cursor:pointer}
.how{position:fixed;inset:0;z-index:30;background:rgba(10,14,20,.55);display:flex;align-items:flex-end;justify-content:center;padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
.how-card{background:var(--card);color:var(--fg);width:100%;max-width:560px;max-height:100%;overflow:auto;border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
@media (min-width:600px){.how{align-items:center}.how-card{border-radius:16px}}
.how-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.how-top h3{margin:0;font:800 26px/1.05 var(--display);text-transform:uppercase}
.how-top .lab{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.how-close{font:600 14px var(--body);border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:8px;padding:8px 12px;cursor:pointer}
.stage{position:relative;background:var(--bg);border-radius:12px;overflow:hidden}
.stage canvas{display:block;width:100%;height:auto;aspect-ratio:320/220;max-width:100%}
.stage .ph{position:absolute;left:12px;top:10px;font:800 22px var(--display);text-transform:uppercase;color:var(--tc);letter-spacing:.03em}
.how ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:15px}
.how .yt{font-size:14px;color:var(--muted)}
.how .yt a{color:var(--tc);font-weight:600}
.vid:focus-visible{outline:2px solid var(--tc);outline-offset:2px}
.finish{width:100%;padding:14px;border-radius:12px;border:0;background:var(--tc);color:var(--bg);font:800 20px var(--display);text-transform:uppercase;letter-spacing:.04em;cursor:pointer}
.note{font-size:13px;color:var(--muted);text-align:center}
.timer{position:fixed;left:0;right:0;bottom:0;background:var(--fg);color:var(--bg);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:20}
.timer-in{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:12px}
.timer .t{font:800 34px/1 var(--display);font-variant-numeric:tabular-nums;min-width:84px}
.timer .lab{font-size:12px;letter-spacing:.08em;text-transform:uppercase;opacity:.75;flex:1}
.timer button{font:600 14px var(--body);background:transparent;color:var(--bg);border:1px solid currentColor;border-radius:8px;padding:8px 10px;cursor:pointer}
.timer .bar{height:3px;background:var(--tc);margin:8px auto 0;max-width:640px;transform-origin:left}
.timer.end{background:var(--ok)}
/* histórico */
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:12px}
.panel h2{font:800 22px var(--display);text-transform:uppercase;margin:0}
.cal-head{display:flex;justify-content:space-between;align-items:center}
.cal-head button{width:40px;height:36px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .dw{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.cal .d{aspect-ratio:1;max-width:100%;border:1px solid var(--line);border-radius:6px;display:flex;align-items:center;justify-content:center;font:600 15px var(--display);position:relative;font-variant-numeric:tabular-nums}
.cal .d.x{color:#fff;border-color:transparent}
.cal .d.today{outline:2px solid var(--fg);outline-offset:-2px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.log{display:flex;flex-direction:column;gap:0}
.log-item{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.log-item b{font-family:var(--display);font-size:17px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{border:1px solid var(--line);border-radius:10px;padding:10px}
.stat b{display:block;font:800 28px/1 var(--display);font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.prog{display:flex;flex-direction:column;gap:6px;font-size:14px}
.prog div{display:flex;justify-content:space-between;gap:8px;border-top:1px solid var(--line);padding-top:6px}
.prog em{font-style:normal;color:var(--muted);font-variant-numeric:tabular-nums}
.empty{color:var(--muted);font-size:14px}
.cfg{display:flex;flex-direction:column;gap:8px;font-size:14px}
.cfg input{font:500 15px var(--body);padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
.danger{color:var(--t2)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>
<body>
<div class="wrap">
  <header>
    <h1>Meu Treino<small>Ficha Academia Bem Estar</small></h1>
    <div class="nav" role="tablist">
      <button id="nav-treino" aria-pressed="true">Treino</button>
      <button id="nav-hist" aria-pressed="false">Histórico</button>
    </div>
  </header>

  <section id="view-treino" style="display:contents">
    <div class="tabs" role="tablist" id="tabs"></div>
    <div class="phase" id="phase"></div>
    <div class="list" id="list"></div>
    <button class="finish" id="finish">Finalizar treino</button>
    <p class="note" id="savenote">Toque em cada série ao terminar. O descanso começa sozinho.</p>
  </section>

  <section id="view-hist" hidden style="flex-direction:column;gap:14px">
    <div class="stats" id="stats"></div>
    <div class="panel">
      <div class="cal-head"><button class="btn" id="mprev" aria-label="Mês anterior">‹</button><h2 id="mname"></h2><button class="btn" id="mnext" aria-label="Próximo mês">›</button></div>
      <div class="cal" id="cal"></div>
      <div class="legend"><span><i style="background:var(--t1)"></i>Treino 1</span><span><i style="background:var(--t2)"></i>Treino 2</span><span><i style="background:var(--t3)"></i>Treino 3</span></div>
    </div>
    <div class="panel"><h2>Evolução de carga</h2><div class="prog" id="prog"></div></div>
    <div class="panel"><h2>Últimos treinos</h2><div class="log" id="log"></div></div>
    <div class="panel cfg">
      <h2>Ajustes</h2>
      <label for="start">Data de início do ciclo (define o mês e a semana da progressão)</label>
      <input type="date" id="start">
      <label for="rest">Descanso entre séries (segundos)</label>
      <input type="number" id="rest" min="15" max="300" step="15" inputmode="numeric">
      <button class="btn danger" id="reset">Apagar todo o histórico</button>
      <p class="empty" id="resetq" hidden>Tem certeza? <button class="btn danger" id="resetyes">Sim, apagar</button> <button class="btn" id="resetno">Cancelar</button></p>
      <p class="empty">Os dados ficam salvos neste aparelho e navegador.</p>
    </div>
  </section>
</div>

<div class="timer" id="timer" hidden>
  <div class="timer-in">
    <div class="t" id="tt">1:00</div>
    <div class="lab" id="tl">Descanso</div>
    <button id="tplus">+15s</button>
    <button id="tstop">Pular</button>
  </div>
  <div class="bar" id="tbar"></div>
</div>

<script>
const TREINOS=[
 {id:1,dia:"Segunda",foco:"Superiores",cor:"--t1",ex:[
  {n:"Flexão de braços",g:"Peito",bw:1},{n:"Crucifixo",g:"Peito"},{n:"Supino com halteres",g:"Peito"},
  {n:"Tríceps testa",g:"Tríceps"},{n:"Tríceps com corda",g:"Tríceps"},{n:"Remada",g:"Costas",q:"remada sentada"},
  {n:"Pulley frente com estribo",g:"Costas",q:"puxada frente com triângulo"},{n:"Rosca na polia baixa",g:"Bíceps",q:"rosca direta na polia baixa"},
  {n:"Desenvolvimento",g:"Ombros",q:"desenvolvimento de ombro"},{n:"Elevação lateral",g:"Ombros",q:"elevação lateral com halteres"},{n:"Abdominal no solo",g:"Abdômen",bw:1}]},
 {id:2,dia:"Terça",foco:"Inferiores",cor:"--t2",ex:[
  {n:"Agachamento",g:"Pernas"},{n:"Leg press 180°",g:"Pernas"},{n:"Cadeira extensora",g:"Pernas"},
  {n:"Cadeira flexora",g:"Pernas"},{n:"Adutor",g:"Quadril"},{n:"Abdutor",g:"Quadril"},
  {n:"Panturrilha sentado",g:"Pernas"},{n:"Abdominal infra",g:"Abdômen",bw:1},{n:"Abdominal oblíquo",g:"Abdômen",bw:1}]},
 {id:3,dia:"Quarta",foco:"Corpo todo",cor:"--t3",ex:[
  {n:"Prancha",g:"Abdômen",tempo:1},{n:"Abdominal dupla",g:"Abdômen",bw:1,q:"abdominal remador"},{n:"Flexão de braços",g:"Peito",bw:1},
  {n:"Tríceps com corda",g:"Tríceps"},{n:"Pulley frente com estribo",g:"Costas",q:"puxada frente com triângulo"},{n:"Remada",g:"Costas",q:"remada sentada"},
  {n:"Desenvolvimento",g:"Ombros",q:"desenvolvimento de ombro"},{n:"Leg press 180°",g:"Pernas"},{n:"Cadeira extensora",g:"Pernas"},
  {n:"Cadeira flexora",g:"Pernas"},{n:"Abdominal no solo",g:"Abdômen",bw:1}]}
];
const FASES=[
 {k:"m1s1",nome:"1º mês · Semana 1",desc:"3 séries de 10 repetições",sets:[10,10,10],w:0},
 {k:"m1s2",nome:"1º mês · Semana 2",desc:"3 séries de 12 repetições",sets:[12,12,12],w:1},
 {k:"m1s3",nome:"1º mês · Semana 3",desc:"3 séries de 15 repetições",sets:[15,15,15],w:2},
 {k:"m1s4",nome:"1º mês · Semana 4",desc:"3 séries de 18 repetições",sets:[18,18,18],w:3},
 {k:"m2",nome:"2º mês · Bi-set",desc:"Dois exercícios seguidos sem descanso, 10 repetições",sets:[10,10,10],biset:1,w:4},
 {k:"m3",nome:"3º mês · Pirâmide",desc:"12, 10 e 8 repetições, aumentando a carga a cada série",sets:[12,10,8],w:5}
];
const KEY="fichaBemEstar.v1";
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
let S={start:today(),rest:60,fase:"auto",loads:{},history:[],cur:{}};
try{const raw=localStorage.getItem(KEY);if(raw)S=Object.assign(S,JSON.parse(raw))}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const $=id=>document.getElementById(id);

function autoFase(){
  const d=Math.floor((new Date(today())-new Date(S.start))/864e5);
  const w=Math.max(0,Math.floor(d/7));
  if(w<4)return FASES[w];
  if(w<8)return FASES[4];
  return FASES[5];
}
function fase(){return S.fase==="auto"?autoFase():FASES.find(f=>f.k===S.fase)||autoFase()}
function weekNum(){return Math.max(0,Math.floor((new Date(today())-new Date(S.start))/864e5/7))}

let sel=(()=>{const wd=new Date().getDay();return wd===1||wd===4?1:wd===2||wd===5?2:wd===3||wd===6?3:1})();

function curKey(){return today()+"#"+sel}
function cur(){const k=curKey();if(!S.cur[k])S.cur[k]={sets:{}};return S.cur[k]}

function renderTabs(){
  $("tabs").innerHTML=TREINOS.map(t=>`<button class="tab" role="tab" style="--c:var(${t.cor})" aria-selected="${t.id===sel}" data-t="${t.id}"><b>Treino ${t.id}</b><span>${t.dia} · ${t.foco}</span></button>`).join("");
  document.documentElement.style.setProperty("--tc",`var(${TREINOS[sel-1].cor})`);
}
function renderPhase(){
  const f=fase(),wk=weekNum();
  const opts=`<option value="auto"${S.fase==="auto"?" selected":""}>Automático</option>`+FASES.map(x=>`<option value="${x.k}"${S.fase===x.k?" selected":""}>${x.nome}</option>`).join("");
  const done=wk>=12&&S.fase==="auto"?`<div class="ex-meta">Ciclo de 3 meses concluído. Hora de uma nova avaliação ou de reiniciar o ciclo nos Ajustes.</div>`:"";
  $("phase").innerHTML=`<div class="phase-top"><div><div class="lab">Fase atual</div><div class="big">${f.nome}</div></div>
   <select id="fasesel" aria-label="Escolher fase">${opts}</select></div>
   <div class="ex-meta">${f.desc}</div>
   <div class="weeks">${FASES.map(x=>`<i class="${x.w<=f.w?"on":""}"></i>`).join("")}</div>${done}`;
  $("fasesel").onchange=e=>{S.fase=e.target.value;save();renderAll()};
}
function lastLoad(n){
  for(let i=S.history.length-1;i>=0;i--){const h=S.history[i];if(h.loads&&h.loads[n]!=null)return h.loads[n]}
  return null;
}
function renderList(){
  const t=TREINOS[sel-1],f=fase(),c=cur();
  $("list").innerHTML=t.ex.map((e,i)=>{
    const st=c.sets[i]||[];
    const all=f.sets.every((_,j)=>st[j]);
    const bi=f.biset&&i%2===0&&i+1<t.ex.length?`<span class="biset">Bi-set ↓</span>`:f.biset&&i%2===1?`<span class="biset">Bi-set ↑</span>`:"";
    const reps=e.tempo?f.sets.map(()=>"30s"):f.sets;
    const lw=lastLoad(e.n);
    const load=e.bw||e.tempo?"":`<label class="load"><input id="l${sel}_${i}" type="number" inputmode="decimal" step="0.5" min="0" value="${S.loads[e.n]??""}" data-n="${e.n}" aria-label="Carga ${e.n}"><span>kg</span></label>`;
    return `<article class="ex${all?" done":""}">
      <div class="num">${i+1}</div>
      <div class="ex-main">
        <div><div class="ex-name">${e.n}${bi}</div>
        <div class="ex-meta">${e.g} · ${e.tempo?"3 × 30 segundos":e.bw?"peso do corpo":f.sets.join(" / ")+" repetições"}</div></div>
        <div class="row">${reps.map((r,j)=>`<button class="set${st[j]?" on":""}" data-i="${i}" data-j="${j}" aria-pressed="${!!st[j]}" aria-label="Série ${j+1}">${r}</button>`).join("")}${load}</div>
        <div class="row">${lw!=null&&!e.bw?`<span class="prev">Última vez: ${lw} kg</span>`:""}<button class="vid" data-v="${i}">▶ Ver como fazer</button></div>
      </div></article>`;
  }).join("");
}
function renderAll(){renderTabs();renderPhase();renderList()}

$("tabs").onclick=e=>{const b=e.target.closest(".tab");if(!b)return;sel=+b.dataset.t;renderAll();window.scrollTo({top:0})};
$("list").onclick=e=>{
  const b=e.target.closest(".set");if(!b)return;
  const i=+b.dataset.i,j=+b.dataset.j,c=cur(),f=fase();
  c.sets[i]=c.sets[i]||[];c.sets[i][j]=!c.sets[i][j];save();renderList();
  if(c.sets[i][j]){
    const t=TREINOS[sel-1];
    if(f.biset&&i%2===0&&i+1<t.ex.length){showTimer(0,"Vá direto para "+t.ex[i+1].n)}
    else startTimer(S.rest,"Descanso · "+t.ex[i].n);
  }
};

function sideSk(p,fr){
  const hip=p.hip,front=p.t+90*fr,sh=P(hip,p.t,LN.t),hd=P(hip,p.t,LN.t+LN.nk);
  const rel=r=>P(P(hip,p.t,r[0]*LN.t),front,r[1]);

  const legOf=(a,t,ft)=>{let k,an;if(a){k=P(hip,a[0],LN.th);an=P(k,a[1],LN.sh)}else[k,an]=ik(hip,t,LN.th,LN.sh,t[2]);
    const f=ft!=null?ft:ang(k,an)-90*fr;return[k,an,P(an,f,LN.ft)]};
  const a1=armOf(p.armA,p.arm,p.armR);
  const l1=legOf(p.legA,p.leg,p.ft),l2=p.leg2?legOf(null,p.leg2,p.ft):l1;
  return{hip,sh,hd,a1,a2:a1,l1,l2};
}
function frontSk(p,o){
  const c=p.hip,shY=c[1]-(o.tl||LN.t),hd=[c[0],shY-LN.nk],sides=[];

    const S=[c[0]+17*s,shY],H=[c[0]+9*s,c[1]];

    let k=null,a=null;

    sides.push({S,H,e,h,k,a,s});
  }
  return{c,shY,hd,sides};
}

function seg(ctx,pts,w,c){ctx.strokeStyle=c;ctx.lineWidth=w;ctx.lineCap="round";ctx.lineJoin="round";ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i][0],pts[i][1]);ctx.stroke()}

}
function statics(ctx,st,C){

}

function draw(ctx,ex,k){
  const C=colors();ctx.clearRect(0,0,320,220);
  ctx.globalAlpha=.35;seg(ctx,[[10,202],[310,202]],2,C.mu);ctx.globalAlpha=1;
  const p=lerp(ex.A,ex.B,k);
  if(ex.v==="s"){
    const s=sideSk(p,ex.fr||1);
    statics(ctx,ex.st,C);
    if(ex.cable){ctx.globalAlpha=.7;seg(ctx,[ex.cable,s.a1[1]],1.5,C.mu);ctx.globalAlpha=1}
    // lado de trás
    ctx.save();ctx.translate(-4,-3);ctx.globalAlpha=.4;
    seg(ctx,[s.hip,s.l2[0],s.l2[1],s.l2[2]],8,C.fg);seg(ctx,[s.sh,s.a2[0],s.a2[1]],7,C.fg);
    ctx.restore();ctx.globalAlpha=1;
    seg(ctx,[s.hip,s.sh],12,C.fg);dot(ctx,s.hd,10,C.fg);
    seg(ctx,[s.hip,s.l1[0],s.l1[1],s.l1[2]],9,C.fg);
    if(ex.pad){const kn=s.l1[0],an=s.l1[1],sa=ang(kn,an);
      const q=ex.pad==="knee"?[kn[0]-4,kn[1]-11]:P(an,sa+(ex.pad==="front"?-90:90)*(ex.fr||1),9);dot(ctx,q,7,C.tc)}
    if(ex.plate){const t=s.l1[2],an=s.l1[1];const x=Math.max(t[0],an[0])+5;ctx.globalAlpha=.85;seg(ctx,[[x,an[1]-26],[x,an[1]+16]],7,C.tc);seg(ctx,[[x,an[1]+16],[x+20,186]],3,C.mu);ctx.globalAlpha=1}
    seg(ctx,[s.sh,s.a1[0],s.a1[1]],8,C.fg);
    if(ex.db)dumb(ctx,s.a1[1],ex.db,C,1);
    if(ex.bar){ctx.globalAlpha=.9;ctx.strokeStyle=C.tc;ctx.lineWidth=4;ctx.beginPath();ctx.arc(s.a1[1][0],s.a1[1][1],11,0,7);ctx.stroke();dot(ctx,s.a1[1],4,C.tc);ctx.globalAlpha=1}
  }else{
    statics(ctx,ex.st,C);
    const f=frontSk(p,ex);
    for(const d of f.sides)if(d.k){seg(ctx,[d.H,d.k,d.a],9,C.fg);seg(ctx,[d.a,[d.a[0]+7*d.s,d.a[1]+1]],7,C.fg)}
    seg(ctx,[[f.c[0],f.c[1]],[f.c[0],f.shY]],14,C.fg);
    seg(ctx,[f.sides[0].S,f.sides[1].S],10,C.fg);
    if(!ex.noLegs)seg(ctx,[f.sides[0].H,f.sides[1].H],10,C.fg);
    dot(ctx,f.hd,10,C.fg);
    for(const d of f.sides){seg(ctx,[d.S,d.e,d.h],8,C.fg);if(ex.db)dumb(ctx,d.h,ex.db,C,1);
      if(ex.pad&&d.k)dot(ctx,[d.k[0]+(ex.pad==="kneeOut"?11:-11)*d.s,d.k[1]+4],7,C.tc)}
  }
}
const ease=x=>x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2;
function phase(ts){const T=(ts/1000)%3.6;if(T<.6)return[0,1];if(T<1.7)return[ease((T-.6)/1.1),0];if(T<2.2)return[1,0];return[1-ease((T-2.2)/1.4),1]}
return{D,draw,phase};
})();

function size(){const dpr=Math.min(3,window.devicePixelRatio||1);const w=Math.round(cv.clientWidth||320);cv.width=w*dpr;cv.height=Math.round(w*220/320)*dpr;ctx.setTransform(cv.width/320,0,0,cv.height/220,0,0)}

function open(e){ex=ANIM.D[e.n];if(!ex)return;lastFocus=document.activeElement;

  box.querySelector("#how-yt").href="https://www.youtube.com/results?search_query="+encodeURIComponent((e.q||e.n)+" execução correta");
  box.hidden=false;size();t0=0;cancelAnimationFrame(raf);raf=requestAnimationFrame(loop);box.querySelector("#how-x").focus()}
function close(){box.hidden=true;cancelAnimationFrame(raf);if(lastFocus)try{lastFocus.focus()}catch(_){}}
box.querySelector("#how-x").onclick=close;
box.addEventListener("click",ev=>{if(ev.target===box)close()});
document.addEventListener("keydown",ev=>{if(ev.key==="Escape"&&!box.hidden)close()});
window.addEventListener("resize",()=>{if(!box.hidden)size()});
